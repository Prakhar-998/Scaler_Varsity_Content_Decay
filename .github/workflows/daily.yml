name: Content health (daily)

on:
  schedule:
    - cron: "17 3 * * *"   # 08:47 IST daily (GSC final data lags ~2-3 days)
  workflow_dispatch:
    inputs:
      rebuild_scope:
        description: "Regenerate this month's Monthly Scope"
        type: boolean
        default: false
      slack:
        description: "Send the Slack summary now"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Update sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ vars.SHEET_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          ARGS=""
          if [ "${{ inputs.rebuild_scope }}" = "true" ]; then ARGS="$ARGS --rebuild-scope"; fi
          if [ "${{ inputs.slack }}" = "true" ]; then ARGS="$ARGS --slack"; fi
          python -m health $ARGS
